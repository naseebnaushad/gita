# Tests every pull request, and builds Gita for Windows, macOS and Linux.
#
# - Pull requests and pushes to master: tests + the three builds. The
#   built apps can be downloaded from the run's "Artifacts" section.
# - A tag like v1.2.0: the same, then a draft GitHub release with the
#   three downloads attached. Check it and press "Publish".
# - "Run workflow" on the Actions tab: the same as a pull request.
#
# Each build includes the `gita` command (in a `cli` folder inside the
# app) and checks that it runs.
name: Build

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: |
          # The tests create git repos and commits.
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          flutter test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
            asset: gita-windows-x64.zip
          - name: macOS
            os: macos-latest
            target: macos
            asset: gita-macos.zip
          - name: Linux
            os: ubuntu-latest
            target: linux
            asset: gita-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $app = "build/windows/x64/runner/Release"
          & "$app/cli/bin/gita.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "The bundled gita command doesn't run." }
          Compress-Archive -Path "$app/*" -DestinationPath "${{ matrix.asset }}"

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          app="build/macos/Build/Products/Release/gita.app"
          "$app/Contents/Resources/cli/bin/gita" --version
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "${{ matrix.asset }}"

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          bundle="build/linux/x64/release/bundle"
          "$bundle/cli/bin/gita" --version
          tar -czf "${{ matrix.asset }}" -C "$bundle" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --draft --generate-notes \
            --title "Gita ${{ github.ref_name }}"
