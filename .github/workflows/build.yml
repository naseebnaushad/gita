# Tests every pull request, and builds Gita for Windows, macOS and Linux.
#
# - Pull requests and pushes to master: tests + the three builds. The
#   built apps can be downloaded from the run's "Artifacts" section.
# - Releases: see release.yml, which calls this workflow on a v* tag.
# - "Run workflow" on the Actions tab: the same as a pull request.
#
# Each build includes the `gita` command (in a `cli` folder inside the
# app) and checks that it runs.
name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: |
          # The tests create git repos and commits.
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          flutter test

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    # Advisory for now: some macOS tests still fail and don't block builds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter test
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          # GITA_TEST_KEYCHAIN also runs the test that round-trips a secret
          # through the real login Keychain.
          GITA_TEST_KEYCHAIN=1 flutter test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
            asset: gita-windows-x64.zip
          - name: macOS
            os: macos-latest
            target: macos
            asset: gita-macos.zip
          - name: Linux
            os: ubuntu-latest
            target: linux
            asset: gita-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libsecret-tools libjsoncpp-dev

      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release

      - name: Version
        id: ver
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $app = "build/windows/x64/runner/Release"
          & "$app/cli/bin/gita.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "The bundled gita command doesn't run." }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$app/*" -DestinationPath "dist/${{ matrix.asset }}"
          # Installer (.exe) made with Inno Setup.
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$((Resolve-Path $app).Path)" packaging/windows/gita.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          app="build/macos/Build/Products/Release/gita.app"
          "$app/Contents/Resources/cli/bin/gita" --version
          codesign --verify --deep --strict "$app"
          scripts/smoke_cli.sh "$app/Contents/Resources/cli/bin/gita"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/${{ matrix.asset }}"
          # Disk image with an Applications shortcut to drag the app onto.
          stage=$(mktemp -d)
          cp -R "$app" "$stage/Gita.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Gita" -srcfolder "$stage" -ov -format UDZO "dist/gita-macos.dmg"

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          bundle="build/linux/x64/release/bundle"
          "$bundle/cli/bin/gita" --version
          scripts/smoke_cli.sh "$bundle/cli/bin/gita"
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "$bundle" .
          # .deb and .rpm
          sudo apt-get install -y rpm ruby
          sudo gem install --no-document fpm
          packaging/linux/package.sh deb "$bundle" "${{ steps.ver.outputs.version }}" dist
          packaging/linux/package.sh rpm "$bundle" "${{ steps.ver.outputs.version }}" dist
          # The .deb installs and the installed command runs.
          sudo apt-get install -y ./dist/*.deb
          gita --version
          rpm -qlp dist/*.rpm | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: Package (Arch Linux)
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm base-devel git sudo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Build the package
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD "$work/"
          # Use the build from this run instead of downloading a release.
          cp linux/gita-linux-x64.tar.gz "$work/gita-linux-x64-$version.tar.gz"
          cp packaging/linux/gita.desktop "$work/gita-$version.desktop"
          cp assets/branding/icon.png "$work/gita-$version.png"
          cp LICENSE "$work/gita-LICENSE-$version"
          chown -R builder "$work"
          cd "$work"
          sudo -u builder env GITA_VERSION="$version" makepkg --noconfirm --nodeps
          pacman -U --noconfirm ./*.pkg.tar.zst
          gita --version
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
